<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Harshal Naresh Gupta - Flutter Developer & Software Engineer Portfolio. Experienced in mobile app development, REST APIs, and cross-platform solutions.">
  <meta name="keywords" content="Harshal Gupta, Flutter Developer, Software Engineer, Mobile App Developer, Portfolio, Mumbai, India">
  <meta name="author" content="Harshal Naresh Gupta">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph tags for social media -->
  <meta property="og:title" content="Harshal Naresh Gupta - Portfolio">
  <meta property="og:description" content="Flutter Developer & Software Engineer specializing in cross-platform mobile applications">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://harshalgupta.dev">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Harshal Gupta Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

  <title>Harshal Gupta - Portfolio</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070908;
      --bg-darker: #040505;
      --accent: #64FFDA;
      --accent-rgb: 100, 255, 218;
      --accent-secondary: #00E5FF;
      --text-muted: rgba(255, 255, 255, 0.5);
      --font-code: 'JetBrains Mono', monospace, ui-monospace;
      --font-body: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      overflow: hidden;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .loading-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(1100px circle at 50% 50%, #0d1a16 0%, #070908 50%, var(--bg-darker) 100%);
      z-index: 999999;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
      will-change: opacity, transform, filter;
    }

    .loading-screen.fade-out {
      opacity: 0;
      transform: scale(1.035);
      filter: blur(8px);
      pointer-events: none;
    }

    /* Ambient Radial Glow */
    .ambient-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14) 0%, rgba(var(--accent-rgb), 0.04) 45%, transparent 70%);
      filter: blur(45px);
      animation: ambientPulse 4.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Lightweight Grid Mask */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(var(--accent-rgb), 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--accent-rgb), 0.028) 1px, transparent 1px);
      background-size: 36px 36px;
      background-position: center center;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.15) 55%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.15) 55%, transparent 75%);
      pointer-events: none;
    }

    /* Ambient Floating Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      opacity: 0.25;
      filter: blur(0.5px);
    }
    .p1 { width: 3px; height: 3px; top: 38%; left: 42%; animation: floatP1 6s ease-in-out infinite alternate; }
    .p2 { width: 2px; height: 2px; top: 62%; left: 58%; animation: floatP2 7s ease-in-out infinite alternate; }
    .p3 { width: 4px; height: 4px; top: 32%; left: 56%; animation: floatP3 8s ease-in-out infinite alternate; }
    .p4 { width: 2px; height: 2px; top: 66%; left: 40%; animation: floatP1 5.5s ease-in-out infinite alternate; }

    /* Central Loader Box */
    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 28px;
      max-width: 440px;
      width: 90%;
      z-index: 2;
    }

    /* Sleek Tech Corners */
    .tech-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: rgba(var(--accent-rgb), 0.25);
      pointer-events: none;
    }
    .tech-bracket.tl { top: 0; left: 0; border-top: 1.5px solid; border-left: 1.5px solid; }
    .tech-bracket.tr { top: 0; right: 0; border-top: 1.5px solid; border-right: 1.5px solid; }
    .tech-bracket.bl { bottom: 0; left: 0; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .tech-bracket.br { bottom: 0; right: 0; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* Top Identity Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(var(--accent-rgb), 0.04);
      border: 1px solid rgba(var(--accent-rgb), 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: var(--font-code);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: rgba(var(--accent-rgb), 0.9);
      margin-bottom: 30px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(var(--accent-rgb), 0.04);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: dotPulse 2s ease-in-out infinite;
    }

    /* Core Futuristic Geometric Loader */
    .loader-visual {
      position: relative;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }

    /* Outer Reticle Ring */
    .ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(var(--accent-rgb), 0.22);
      animation: rotateRight 16s linear infinite;
    }

    /* Orbiting Node on Outer Ring */
    .ring-outer-node {
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    /* Middle Smooth Accent Arc */
    .ring-middle {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: rgba(var(--accent-rgb), 0.45);
      filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.5));
      animation: rotateRight 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Inner Counter-Rotating Ring */
    .ring-inner {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-bottom-color: rgba(var(--accent-rgb), 0.85);
      border-left-color: rgba(var(--accent-rgb), 0.25);
      animation: rotateLeft 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Center Developer Glyph */
    .center-glyph {
      font-family: var(--font-code);
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      opacity: 0.95;
      text-shadow: 0 0 12px rgba(var(--accent-rgb), 0.7);
      animation: breathGlyph 2.4s ease-in-out infinite;
      user-select: none;
      transform: scale(1);
    }

    /* Title Typography */
    .loading-title {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 16px;
      background: linear-gradient(120deg, #FFFFFF 20%, rgba(var(--accent-rgb), 1) 55%, #FFFFFF 90%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3.5s linear infinite;
    }

    /* Progress Bar Track */
    .progress-wrapper {
      width: 100%;
      max-width: 230px;
      margin-bottom: 14px;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 8%;
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.6), var(--accent));
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.65);
      transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 16px;
      background: #FFFFFF;
      filter: blur(2px);
      opacity: 0.75;
      border-radius: 50%;
    }

    /* Dynamic Status Row */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 230px;
      font-family: var(--font-code);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      min-height: 16px;
    }

    .status-text {
      text-transform: uppercase;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-text.fade {
      opacity: 0;
      transform: translateY(2px);
    }

    .status-percent {
      color: var(--accent);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      margin-left: 8px;
    }

    /* Keyframes */
    @keyframes rotateRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateLeft {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes ambientPulse {
      0% { opacity: 0.55; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes breathGlyph {
      0%, 100% { opacity: 0.75; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.08); text-shadow: 0 0 16px rgba(var(--accent-rgb), 0.9); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    @keyframes floatP1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(18px, -24px); }
    }
    @keyframes floatP2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-20px, 20px); }
    }
    @keyframes floatP3 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(14px, 28px); }
    }

    /* Prefers Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .ring-outer, .ring-middle, .ring-inner, .ambient-glow, .center-glyph, .status-dot, .loading-title, .particle {
        animation: none !important;
      }
      .loading-screen {
        transition: opacity 0.2s ease !important;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading">
    <div class="ambient-glow"></div>
    <div class="grid-overlay"></div>
    
    <!-- Micro Particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

    <div class="loader-container">
      <div class="tech-bracket tl"></div>
      <div class="tech-bracket tr"></div>
      <div class="tech-bracket bl"></div>
      <div class="tech-bracket br"></div>

      <!-- Identity Badge -->
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>HARSHAL GUPTA // PORTFOLIO</span>
      </div>

      <!-- Core Animated Visual -->
      <div class="loader-visual">
        <div class="ring-outer">
          <div class="ring-outer-node"></div>
        </div>
        <div class="ring-middle"></div>
        <div class="ring-inner"></div>
        <div class="center-glyph">&lt;/&gt;</div>
      </div>

      <!-- Typography -->
      <div class="loading-title">Loading Portfolio</div>

      <!-- Horizontal Progress Bar -->
      <div class="progress-wrapper">
        <div class="progress-track">
          <div class="progress-bar" id="loading-bar"></div>
        </div>
      </div>

      <!-- Dynamic Status Line & Counter -->
      <div class="status-row">
        <span class="status-text" id="loading-status">INITIALIZING EXPERIENCE</span>
        <span class="status-percent" id="loading-percent">12%</span>
      </div>
    </div>
  </div>
  
  <script>
    (function () {
      const bar = document.getElementById('loading-bar');
      const percentText = document.getElementById('loading-percent');
      const statusText = document.getElementById('loading-status');
      const loading = document.getElementById('loading');

      const statuses = [
        { threshold: 0, text: 'INITIALIZING EXPERIENCE' },
        { threshold: 35, text: 'LOADING PROJECTS & SKILLS' },
        { threshold: 72, text: 'PREPARING UI COMPONENTS' },
        { threshold: 92, text: 'FINALIZING' }
      ];

      let currentPercent = 12;
      let targetPercent = 90;
      let statusIdx = 0;
      let isCompleted = false;

      function updateStatus(newText) {
        if (!statusText || statusText.textContent === newText) return;
        statusText.classList.add('fade');
        setTimeout(() => {
          statusText.textContent = newText;
          statusText.classList.remove('fade');
        }, 150);
      }

      // Smooth asymptotic progress simulation while resources download
      const timer = setInterval(() => {
        if (isCompleted) return;
        if (currentPercent < targetPercent) {
          const delta = Math.max(0.5, (targetPercent - currentPercent) * 0.08);
          currentPercent = Math.min(targetPercent, currentPercent + delta);
          const rounded = Math.floor(currentPercent);
          
          if (bar) bar.style.width = currentPercent + '%';
          if (percentText) percentText.textContent = rounded + '%';

          for (let i = statuses.length - 1; i >= 0; i--) {
            if (rounded >= statuses[i].threshold) {
              if (statusIdx !== i) {
                statusIdx = i;
                updateStatus(statuses[i].text);
              }
              break;
            }
          }
        }
      }, 50);

      window.addEventListener('flutter-first-frame', function () {
        isCompleted = true;
        clearInterval(timer);

        if (bar) bar.style.width = '100%';
        if (percentText) percentText.textContent = '100%';
        updateStatus('READY');

        // Smooth exit transition
        setTimeout(function () {
          if (!loading) return;
          loading.classList.add('fade-out');
          setTimeout(function () {
            loading.remove();
          }, 450);
        }, 160);
      });
    })();
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
